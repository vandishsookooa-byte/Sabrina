<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sabrina Attendance Dashboard{% endblock %}</title>

  <!-- Bootstrap 5 dark -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Choices.js (multi-select) -->
  <link href="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css" rel="stylesheet" />
  <!-- Custom dark theme -->
  <link href="/static/css/style.css" rel="stylesheet" />
</head>
<body class="dark-theme">

<!-- ── Top Navigation ───────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark navbar-expand-lg top-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="bi bi-speedometer2 text-accent fs-4"></i>
      <span class="fw-bold">SABRINA <span class="text-accent">Attendance Intelligence</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="bi bi-house-door me-1"></i>Executive Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'drilldown' %}active{% endif %}" href="/drilldown">
            <i class="bi bi-diagram-3 me-1"></i>Drill-Down Analytics
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'methodology' %}active{% endif %}" href="/methodology">
            <i class="bi bi-journal-text me-1"></i>Calculation Methodology
          </a>
        </li>
      </ul>
      <span class="navbar-text text-muted ms-3 small">
        <i class="bi bi-calendar3 me-1"></i>
        <span id="currentDateTime"></span>
      </span>
    </div>
  </div>
</nav>

<!-- ── Main content ───────────────────────────────────────────────────────── -->
<div class="main-content">
  {% block content %}{% endblock %}
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('currentDateTime').textContent =
      now.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) + ' ' +
      now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>

{% block scripts %}{% endblock %}
</body>
</html>
